<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <title>Dashboard</title>
    <style>
        *
        {
            margin:2vmin;
        }

        .parent
        {
             display: flex;
             flex-direction: column;
            align-items: center;
            justify-content: center;
           
        }
     .child1
        {
           
            width:80vmin;
            height:40vmin;
            background-color:#0F172A ;
            border-radius:1.8vmin;
        }
        .spin
        {
            display: inline-block;
            animation: spin 2s linear infinite;
            margin-top:10vmax;
            
        }
        
        @keyframes spin {
        from { transform: rotateY(0deg); }
        to { transform: rotateY(360deg); }
        }


        .row {
            display: flex;
            justify-content: space-around; 
            margin-top: 0%;
            }

        .income, .expense {
        margin-left: 1.5vmin;
        }

        .parent2{
            display:flex;
            /* flex-direction: column; */
            justify-content: center;
            align-items: center;

        }
        .child3, .child4
        {
            width:25vmin;
            height:20vmin;
            background-color: #0F172A;
            margin-left: 4vmax;
            margin-right: 4vmax;
            
            border-radius: 0.9vmin;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        button{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button1{
            background-color: #10B981;
        }

        .button1:hover
        {
            background-color: lightgreen;
        }
        .button2{
            background-color: #10B981;
        }

        .button2:hover
        {
            background-color: red;
        }


    </style>
</head>

<body>
    <main>
        <div class="parent">
         
            <h1 style=" margin-left: 8vmin; color:#10B981; margin-top: 8vmin; margin-bottom: 0%;font-size: 4vmin;">Current Balance <span class="w3-content  spin" style="color:#10B981; margin:0%;">₹</span></h1>
           
        <div class="child1">
             <h2 style=" margin-left: 8vmin; color:#10B981;  font-size: 5.5vmin; margin-top: 0%; margin-bottom:0%;">$ 52,000</h2>
         
           <div class="row">
            <div class="income">
                <h4 style="color:#10B981;">
                <span style="color:lightgreen;">↓</span> Income
                </h4>
                <h3 style="color:#10B981;margin-left: 3vmin;">$ 45600</h3>
            </div>

        <div class="expense">
            <h4 style="color:#10B981; margin-left: 8vmin;">
            <span style="color:red;">↑</span> Expense
            </h4>
            <h3 style="color:#10B981;margin-left: 12vmin;">$ 45600</h3>
        </div>
        </div>
        </div>        
        </div> 
       

        <div class="parent2">
            <div class="child3">
                <button class= "button1" style="  width:8vmin; height:8vmin;  border-radius: 5vmin; border:none;  margin-top: 4vmin;">
                    <span style="font-size: 4.5vmin; ">+</span>
                </button>
                <h4 style="color:#10B981">Add Income</h4>
            </div>
            
            <div class="child4">
                <button class= "button2" style=" width:8vmin; height:8vmin;  border-radius: 5vmin; border:none; margin-top: 4vmin;  ">
                    <span style="font-size: 5vmin; ">−</span>
                </button>
                <h4 style="color:#10B981; ">Add Expense</h4>
            </div>
            
        </div>
         
        

        
        
        
         
        
       
    </main>
</body>
</html>
