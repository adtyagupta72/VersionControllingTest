<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <title>Dashboard</title>
    <style>
        *
        {
            margin:2vmin;
        }

        .parent
        {
             display: flex;
             flex-direction: column;
            align-items: center;
            justify-content: center;
        }
     .child1
        {
           
            width:80vmin;
            height:40vmin;
            background-color:#0F172A ;
            border-radius:1.8vmin;
        }
        .spin
        {
            display: inline-block;
            animation: spin 2s linear infinite;
            
        }
        
        @keyframes spin {
        from { transform: rotateY(0deg); }
        to { transform: rotateY(360deg); }
        }


        .row {
            display: flex;
            justify-content: space-around; 
            margin-top: 0%;
            }

        .income, .expense {
        margin-left: 1.5vmin;
        }



    </style>
</head>

<body>
    <main>
        <div class="parent">
           
        <div class="child1">
            <h1 style=" margin-left: 8vmin; color:#10B981; margin-top: 4vmin; margin-bottom: 0%;font-size: 4vmin;">Current Balance <span class="w3-content  spin" style="color:#10B981; ">$</span></h1>
             <h2 style=" margin-left: 8vmin; color:#10B981;  font-size: 5.5vmin; margin-top: 0%; margin-bottom:0%;">$ 52,000</h2>
           <!-- <h4 style="color:#10B981; margin-top: 2vmin; "> <span style=" margin-left: 8vmin;   color:lightgreen; ">↓</span>income</h4>
           <h3 style="margin-left: 8vmin; color:#10B981;">$ 45600</h3>

           <h4 style="color:#10B981; margin-top: 2vmin;"> <span style=" margin-left: 8vmin;   color:red; ">↑</span>Expense</h4>
           <h3 style="margin-left: 8vmin; color:#10B981;">$ 45600</h3> -->

           <div class="row">
            <div class="income">
                <h4 style="color:#10B981;">
                <span style="color:lightgreen;">↓</span> Income
                </h4>
                <h3 style="color:#10B981;margin-left: 3vmin;">$ 45600</h3>
            </div>

        <div class="expense">
            <h4 style="color:#10B981; margin-left: 8vmin;">
            <span style="color:red;">↑</span> Expense
            </h4>
            <h3 style="color:#10B981;margin-left: 12vmin;">$ 45600</h3>
        </div>
        </div>
          
         
        </div>
        
        </div>

        
        
        
         
        
       
    </main>
</body>
</html>
