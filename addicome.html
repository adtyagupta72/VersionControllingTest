<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>AddIncome</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <header class="absolute top-0 flex flex-row justify-between w-full px-2 py-2 bg-green-200 ">
        <h2 class="font-bold text-3xl font-sans">Income Overview</h2>
        <nav class="">
            <ul class="flex flex-row justify-center gap-4">
                <li>DashBoard</li>
                <li>Income</li>
                <li>Expense</li>
            </ul>
        </nav>
    </header>
    <div class="w-full max-w-md bg-white p-6 rounded-lg shadow-lg shadow-black">
        <h1 class="text-2xl font-bold text-center mb-6">
            Add Income
        </h1>

        <form>
            <!-- Name -->
            <div class="mb-4">
                <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">
                    Amount
                </label>

                <input type="number" id="amount" name="amount" placeholder="Enter the amount.." class="w-full px-4 py-2 border border-gray-300 rounded-md
                           focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Email -->
            <div class="mb-4 flex flex-row justify-between">
                <div class="mb-4">
                    <label for="category" class="block text-sm font-medium text-gray-700 mb-0">
                        Category
                    </label>
                    <select name="category" id="category" class="w-full max-w-md px-4 py-2  border border-gray-300 rounded-md
                           focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Salary">Salary</option>
                        <option value="Bonus">Bonus</option>
                        <option value="Gift">Gift</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="date" class="block text-sm font-medium text-gray-700 mb-1">
                        Date
                    </label>

                    <input type="date" id="date" name="date" placeholder="Enter the date" class="w-full px-4 py-2 border border-gray-300 rounded-md
                           focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="mb-4">
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">
                    Title
                </label>
                <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-md
                           focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md
                       hover:bg-blue-700 transition duration-300">
                Add
            </button>
        </form>
    </div>
</body>
</html>
