<!DOCTYPE html>
<html lang='en'>
<head>

    <title>SignUp</title>
    <link rel='stylesheet' href='main.css'>
</head>

<body>
    <main>
        <section>
            <div class="w3-container div1" style="max-width:100% ; ">
                <h1 ><strong>Create Account<span class="w3-content" style="float:right; color:#10B981;">$</span></strong></h1><br>

           </div>
           
           <div class="w3-container">
            <form>
                <label>Full Name</label><br>

                <input  type="password" title="Enter password"><br><br>

                <center><button class="create" >Create Account</button></center>
            </form>
            <center><p>Already have an account ?<a href="login.html" style="font-weight: bolder; text-decoration: none;">Sign in</a></p></center>
           </div>
        </section>
    </main>
