<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>SignUp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            height: 90vh;
            display: flex;
            background-color: #F8F9FA;
        }

        .signUp,
        .signIn {
            width: fit-content;
            border: 1px solid black;
            background-color:rgba(red, green, blue, 0.4) #f0f8ff;
            border-radius: 10px;
            margin: auto;
            padding: 1%;
        }

        .signUp:hover,
        .signIn:hover {
            box-shadow: 3px 3px 20px 3px #8b7878;
        }

        form {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 2rem;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        form input {
            padding: 8px;
        }

        .buttons input{
            padding: 8%;
            background-color: #2279cf;
            font-size: 0.9rem;
            color: aliceblue;
            border-radius: 5px;
        }
        .buttons input:hover{
            cursor: pointer;
        }

        .buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .signIn {
            display: none;
        }

        nav {
            padding: 1%;
        }
        h1{
            font-weight: 700;
        }
        label{
            font-size: larger;
        }
    </style>
</head>

<body>
    <nav>
        <div>
            <h1>MyKha₹cha</h1>
            <hr>
            <h3>Track Your Expenses and Savings</h3>
        </div>
        <br>
        <br>
        <section>
            <div>
                <h2>Track your Money flow and get Insights of your monthly transactions.</h2>
            </div>
            <br>
            <br>
            <div>
                <h1>start Now to get Your money on right Track! </h1>
            </div>
        </section>
    </nav>
    <div class="signUp">
        <form action="">
            <h1>SignUp</h1>
            <label for="first-name">Full Name:
                <input type="text" placeholder="Enter your Full Name" required>
            </label>
            <label for="email">
                Email:
                <input type="email" placeholder="Enter Your Email" required>
            </label>
            <label for="setPass">
                SetPassword (5-10 characters):
                <input type="password" placeholder="Enter the password" minlength="5" maxlength="10"
                    pattern="^(?=.{5,10}$)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).*$" required>
            </label>
            <label for="confirmPass">
                ConfirmPassword:
                <input type="password" placeholder="Confirm Your password" minlength="5" maxlength="10"
                    pattern="^(?=.{5,10}$)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).*$" required>
            </label>
            <div class="buttons">
                <input type="button" value="SignUp">
                <input type="button" value="SignIn" onclick=" btnClicked() ">
            </div>
        </form>
    </div>

    <div class="signIn">
        <form action="">
            <h1>SignIn</h1>
            <label for="email">Email:
                <input type="email" placeholder="Enter your Email" required>
            </label>

            <label for="pass">
                Password (5-10 characters):
                <input type="password" placeholder="Enter the password" minlength="5" maxlength="10"
                    pattern="^(?=.{5,10}$)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).*$" required>
            </label>
            <div class="buttons">
                <label for="checkbox">
                    Remember me:
                    <input type="checkbox" name="checkbox">
                </label>
                <label for="forgotPass">
                    <input type="button" value="Forgot Password">
                </label>
            </div>
            <div class="buttons">
                <input type="button" value="SignIn">
                <input type="button" value="Cancel" onclick="cancelClicked()">
            </div>
        </form>
    </div>
</body>
<script>
    function btnClicked() {
        document.querySelector(".signIn").style.display = "block"
        document.querySelector(".signUp").style.display = "none"
    }
    function cancelClicked() {
        document.querySelector('.signIn').style.display = 'none'
        document.querySelector('.signUp').style.display = 'block'
    }
</script>

</html>
