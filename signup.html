<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>SignUp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
        }

        .signUp ,.signIn{
            width: fit-content;
            border: 1px solid black;
            border-radius: 10px;
            margin: auto;
            padding: 1%;
        }
        .signUp:hover,.signIn:hover{
            box-shadow: 3px 3px 20px 3px #8b7878;;
        }
        form {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        h1{
            font-size: 2rem;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        form input{
            padding: 3px;
        }
        .buttons button{
            padding: 10px;
        }
        .buttons{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .signIn{
            display: none;
        }
    </style>
</head>

<body>
    <div class="signUp">
        <form action="">
            <h1>SignUp</h1>
            <label for="first-name">Full Name
                <input type="text" placeholder="Enter your Full Name" required>
            </label>
            <label for="email">
                Email
                <input type="email" placeholder="Enter Your Email" required>
            </label>
            <label for="setPass">
                SetPassword (5-10 characters)
                <input type="password" placeholder="Enter the password" minlength="5" maxlength="10"
                    pattern="^(?=.{5,10}$)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).*$" required>
            </label>
            <label for="confirmPass">
                ConfirmPassword
                <input type="password" placeholder="Confirm Your password" minlength="5" maxlength="10"
                    pattern="^(?=.{5,10}$)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).*$" required>
            </label>
            <div class="buttons">
                <input type="button" value="SignUp">
                <input type="button" value="SignIn" onclick="document.getElementsByClassName('signIn').style.display='block' ">
            </div>
        </form>
    </div>

    <div class="signIn">
        <form action="">
            <h1>SignIn</h1>
            <label for="email">Email
                <input type="email" placeholder="Enter your Email" required>
            </label>
            
            <label for="pass">
                Password (5-10 characters)
                <input type="password" placeholder="Enter the password" minlength="5" maxlength="10"
                    pattern="^(?=.{5,10}$)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).*$" required>
            </label>
            <label for="checkbox">
                Remember me
                <input type="checkbox">
            </label>
            <label for="forgotPass">
                <input type="button" value="Forgot Password">
            </label>
            <div class="buttons">
                <input type="button" value="SignIn">
            </div>
        </form>
    </div>
</body>

</html>
