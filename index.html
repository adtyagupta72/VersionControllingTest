<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <title>Dashboard</title>
    <style>
       
        *
        {
            margin:2vmin;
        }

        .parent
        {
             display: flex;
             flex-direction: column;
            align-items: center;
            justify-content: center;
            
           
           
        }
     .child1
        {
           
            width:80vmin;
            height:40vmin;
            background-color:#0F172A ;
            border-radius:1.8vmin;
             box-shadow: 0 4px 6px rgba(16, 14, 14, 0.627);
        }
        .spin
        {
            display: inline-block;
            animation: spin 2s linear infinite;
            margin-top:10vmax;
            
        }
        
        @keyframes spin {
        from { transform: rotateY(0deg); }
        to { transform: rotateY(360deg); }
        }


        .row {
            display: flex;
            justify-content: space-around; 
            margin-top: 0%;
            }

        .income, .expense {
        margin-left: 1.5vmin;
        }

        .parent2{
            display:flex;
            /* flex-direction: column; */
            justify-content: center;
            align-items: center;
           

            

        }
        .child3, .child4
        {
            width:25vmin;
            height:20vmin;
            background-color: #0F172A;
            margin-left: 4vmax;
            margin-right: 4vmax;
            
            border-radius: 0.9vmin;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 0vmin;
            box-shadow: 0 4px 6px rgba(16, 14, 14, 0.627);
        }

        button{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button1{
            background-color: #10B981;
        }

        .button1:hover
        {
            background-color: lightgreen;
             transform: scale(1.02);
             box-shadow: 0 0 10px rgba(0,255,0,0.3);
        }
        .button2{
            background-color: #10B981;
           
        }

        .button2:hover
        {
            background-color: red;
            transform: scale(1.02);
            box-shadow: 0 0 10px rgba(170, 42, 3, 0.23);
        }

     h3,h4{
            transition: all 0.2s ease;
        }

       h3:hover,h4:hover{
            transform: scale(1.1);
        }

    </style>
</head>

<body>
    <main>
        <div class="parent">
         <div class="child1">
            <h4 style="float:right; color:#10B981; margin-right:2vmin;">🪙Paisa.com</h4>
            <h1 style=" margin-left: 8vmin; color:#10B981; margin-top: 6vmin; margin-bottom: 2vmin;font-size: 4vmin;">Current Balance <span class="w3-content  spin" style="color:#10B981; margin:0%;">₹</span></h1>
           
        
             <h2 id="balance" style=" margin-left: 8vmin; color:#10B981;  font-size: 5.5vmin; margin-top: 0%; margin-bottom:0%;">₹0</h2>
         
           <div class="row">
            <div class="income">
                <h4 style="color:lightgreen;">
                <span style="color:lightgreen;">↓</span> Income
                </h4>
                <h3  id ="income" style="color:lightgreen;margin-left: 3vmin;">₹0</h3>
            </div>

        <div class="expense">
            <h4 style="color:red; margin-left: 8vmin;">
            <span style="color:red;">↑</span> Expense
            </h4>
            <h3 id="expense" style="color:red;margin-left: 12vmin;">₹0</h3>
        </div>
        </div>
        </div>        
        </div> 
       

        <div class="parent2">
            <div class="child3">
                <button onclick="addIncomePrompt()" class= "button1" style="  width:8vmin; height:8vmin;  border-radius: 5vmin; border:none;  margin-top: 4vmin;">
                  
                    <span style="font-size: 4.5vmin; ">+</span>
                </button>
                <h4 style="color:#10B981">Add Income</h4>
            </div>
            
            <div class="child4">
                <button onclick="addExpensePrompt()" class= "button2" style=" width:8vmin; height:8vmin;  border-radius: 5vmin; border:none; margin-top: 4vmin;  ">
                    <span style="font-size: 5vmin; ">−</span>
                </button>
                <h4 style="color:#10B981; ">Add Expense</h4>
            </div>
            
        </div>
         
        

        
        
        
         
        
       
    </main>
    <script>
        let balance = 0;
        let income = 0;
        let expense = 0;

        function addIncomePrompt()
         {
        let amount = parseInt(prompt("Enter income amount:"));
        if(!isNaN(amount) && amount > 0)
            {
                income += amount;
                updatedashboard();
            }
        }

        function addExpensePrompt() 
        {
        let amount = parseInt(prompt("Enter expense amount:"));
            if(!isNaN(amount) && amount > 0)
            {
                expense += amount;
                updatedashboard();
            }
        }
        function updatedashboard()
        {
            balance = income - expense 
            document.getElementById('balance').innerText = "₹" + balance;
            document.getElementById('expense').innerText = "₹" + expense;
            document.getElementById('income').innerText = "₹" + income;
        }
    </script>
</body>
</html>
