<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <title>Dashboard</title>
    <style>
       
        *
        {
            margin:2vmin;
        }

        .parent
        {
             display: flex;
             flex-direction: column;
            align-items: center;
            justify-content: center;
            
           
           
        }
     .child1
        {
           
            width:80vmin;
            height:40vmin;
            background-color:#0F172A ;
            border-radius:1.8vmin;
             box-shadow: 0 4px 6px rgba(16, 14, 14, 0.627);
        }
        .spin
        {
            display: inline-block;
            animation: spin 2s linear infinite;
            margin-top:10vmax;
            
        }
        
        @keyframes spin {
        from { transform: rotateY(0deg); }
        to { transform: rotateY(360deg); }
        }


        .row {
            display: flex;
            justify-content: space-around; 
            margin-top: 0%;
            }

        .income, .expense {
        margin-left: 1.5vmin;
        }

        .parent2{
            display:flex;
            
            justify-content: center;
            align-items: center;
           

            

        }
        .child3, .child4
        {
            width:25vmin;
            height:20vmin;
            background-color: #0F172A;
            margin-left: 4vmax;
            margin-right: 4vmax;
            
            border-radius: 0.9vmin;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 0vmin;
            box-shadow: 0 4px 6px rgba(16, 14, 14, 0.627);
        }

        button{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button1{
            background-color: #10B981;
        }

        .button1:hover
        {
            background-color: lightgreen;
             transform: scale(1.02);
             box-shadow: 0 0 10px rgba(0,255,0,0.3);
        }
        .button2{
            background-color: #10B981;
           
        }

        .button2:hover
        {
            background-color: red;
            transform: scale(1.02);
            box-shadow: 0 0 10px rgba(170, 42, 3, 0.23);
        }

     h3,h4{
            transition: all 0.2s ease;
        }

       h3:hover,h4:hover{
            transform: scale(1.1);
        }

        .dialog {
        display: none; 
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
        }

        .dialog-content 

        {
        background: #0F172A;
        padding: 2vmin;
        border-radius: 2vmin;
        text-align: center;
        color: #10B981;
        font-size: 2vmin;
        }
        .create1, .create2
        {
            width:5vmax;
            height:5vmin;
             border-radius:1vmin;
             background-color: #0F172A;
             color:white;
             font-weight: bolder;
             margin-left: 2vmin;
             margin-right: 2vmin;
            
        }
        .create1:hover{
            color:#10B981;
        }
        .create2:hover{
            color:red;
        }

        li{
            color:white;
            margin-left: 0vmin;
            
        }

       
    </style>
</head>

<body>
    <main>
        <div class="parent">
         <div class="child1">
            <h4 style="float:right; color:#10B981; margin-right:2vmin;">🪙Paisa.com</h4>
            <h1 style=" margin-left: 8vmin; color:#10B981; margin-top: 6vmin; margin-bottom: 2vmin;font-size: 4vmin;">Current Balance <span class="w3-content  spin" style="color:#10B981; margin:0%;">₹</span></h1>
           
        
             <h2 id="balance" style=" margin-left: 8vmin; color:#10B981;  font-size: 5.5vmin; margin-top: 0%; margin-bottom:0%;">₹0</h2>
         
           <div class="row">
            <div class="income">
                <h4 style="color:lightgreen;">
                <span style="color:lightgreen;">↓</span> Income
                </h4>
                <h3  id ="income" style="color:lightgreen;margin-left: 3vmin;">+₹0</h3>
            </div>

        <div class="expense">
            <h4 style="color:red; margin-left: 8vmin;">
            <span style="color:red;">↑</span> Expense
            </h4>
            <h3 id="expense" style="color:red;margin-left: 12vmin;">-₹0</h3>
        </div>
        </div>
        </div>        
        </div> 
       

        <div class="parent2">
            <div class="child3">
                <button onclick="openDialog('income')" class= "button1" style="  width:8vmin; height:8vmin;  border-radius: 5vmin; border:none;  margin-top: 4vmin;">
                  
                    <span style="font-size: 4.5vmin; ">+</span>
                </button>
                <h4 style="color:#10B981">Add Income</h4>
            </div>
            
            <div class="child4">
                <button onclick="openDialog('expense')" class= "button2" style=" width:8vmin; height:8vmin;  border-radius: 5vmin; border:none; margin-top: 4vmin;  ">
                    <span style="font-size: 5vmin; ">−</span>
                </button>
                <h4 style="color:#10B981; ">Add Expense</h4>
            </div>            
        </div>
        <div style="display: flex; justify-content: center;">
        <div   style="background-color: #0F172A; width:80vmin; height:100%; border-radius:1.5vmin;">
        <h2 style="color:#10B981; margin-left:5vmin; margin-top:2vmin; font-size: 3vmin;">Recent Transactions</h2>
        <ul id="transactionList" ></ul>
        </div>
        </div>

        <div id="dialogBox" class="dialog">
        <div class="dialog-content">
            <h3 id="dialogTitle">Enter Amount</h3>
            <input type="number" id="dialogAmount" placeholder="Enter Amount">

            <select id="dialogCategory">
            <option value="Salary">Salary</option>
            <option value="Food">Food</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Other">Medicine</option>
            <option value="Other">Tax</option>   
            <option value="Other">Travel</option> 
            <option value="Other">Other</option>
            </select>


        <div style="display: flex;"> 
            <button onclick="closeDialog()" class="create2">Cancel</button>   
            <button onclick="submitAmount()" class="create1">Add</button>
            
        </div>    
        </div>
</div>
         
        

        
        
        
         
        
       
    </main>

    <script>

        let transactions = [];
        let balance = 0;
        let income = 0;
        let expense = 0;
        let currentType = ""; 
        function openDialog(type){
        currentType = type;
        document.getElementById("dialogTitle").innerText = 
            type === "income" ? "+Income Amount" : "-Expense Amount";
        document.getElementById("dialogBox").style.display = "flex";
        }

        function closeDialog(){
        document.getElementById("dialogBox").style.display = "none";
        }

        function submitAmount(){
        let amount = parseInt(document.getElementById("dialogAmount").value);
        let category = document.getElementById("dialogCategory").value;
        if(!isNaN(amount) && amount > 0){
            if(currentType === "income")
            {
            income += amount;
            transactions.push({type:"Income" , amount:amount, category: category , date: new Date().toLocaleString("en-GB") })
            } 
            else
            {
            expense += amount;
            transactions.push({ type: "Expense", amount: amount, category: category, date: new Date().toLocaleString("en-GB") });
            }
            updatedashboard();
            updateTransactionList();
        }
        closeDialog();
        document.getElementById("dialogAmount").value = ""; 
        }

        function updatedashboard(){
        balance = income - expense;
        document.getElementById('balance').innerText = "₹" + balance;
        document.getElementById('income').innerText = "+₹" + income;
        document.getElementById('expense').innerText = "-₹" + expense;
        }

        function updateTransactionList(){
  const list = document.getElementById("transactionList");
  list.innerHTML = "";

  if (transactions.length === 0) {
    // Create a container for empty state
    const emptyDiv = document.createElement("div");
    emptyDiv.style.textAlign = "center";
    emptyDiv.style.padding = "2vmin";

    // Wallet image
    const img = document.createElement("img");
    img.src = "new2.png";
    img.alt = "Wallet";
    // img.style.width = "50px";
    img.style.width = "30vmin";   // width badha di
    img.style.height = "30vmin";
    img.style.position = "center";
    
    //
   


    img.style.opacity = "0.8";

    // Heading text
    const heading = document.createElement("h3");
    heading.innerText = "No transactions";
    heading.style.color = "#10B981";

    emptyDiv.appendChild(img);
    emptyDiv.appendChild(heading);
    list.appendChild(emptyDiv);
  } else {

  transactions.forEach(txn => {
    const li = document.createElement("li");
    li.innerText = `${txn.type}: ₹${txn.amount} | Category: ${txn.category} | Date: ${txn.date}`;
    
    list.appendChild(li);
  })
}
     }

 window.onload = function(){
        updateTransactionList();
    }
</script>

</body>
</html>
